<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cari Kode Pos Indonesia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-pattern" aria-hidden="true"></div>

  <!-- HERO HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-area">
        <img src="logo.png" alt="Pos Indonesia – Logistik Indonesia" class="logo-img" />
      </div>
      <div class="header-tagline">
        <h1 class="hero-title">Pencarian <span class="hero-accent">Kode Pos</span></h1>
        <p class="hero-sub">Temukan kode pos seluruh wilayah Indonesia dengan mudah</p>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- Loading State -->
    <div id="loading-state" class="loading-card" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-text">
        <p class="loading-title">Memuat data wilayah&hellip;</p>
        <p class="loading-desc">Sedang memproses 80.000+ data kode pos</p>
      </div>
    </div>

    <!-- Main Card -->
    <div id="main-card" class="card hidden">

      <div class="card-head">
        <span class="card-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M10 2C6.69 2 4 4.69 4 8C4 12.5 10 18 10 18C10 18 16 12.5 16 8C16 4.69 13.31 2 10 2ZM10 10.5C8.62 10.5 7.5 9.38 7.5 8C7.5 6.62 8.62 5.5 10 5.5C11.38 5.5 12.5 6.62 12.5 8C12.5 9.38 11.38 10.5 10 10.5Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="card-head-label">Pilih Wilayah</span>
      </div>

      <div class="step-grid">

        <!-- Provinsi -->
        <div class="field-group">
          <label class="field-label" for="sel-provinsi">
            <span class="step-badge">1</span>
            Provinsi
          </label>
          <div class="select-wrapper">
            <select id="sel-provinsi" class="select">
              <option value="">— Pilih Provinsi —</option>
            </select>
            <span class="select-arrow" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </div>
        </div>

        <!-- Kabupaten/Kota -->
        <div class="field-group">
          <label class="field-label" for="sel-kabupaten">
            <span class="step-badge">2</span>
            Kabupaten / Kota
          </label>
          <div class="select-wrapper">
            <select id="sel-kabupaten" class="select" disabled>
              <option value="">— Pilih Kabupaten/Kota —</option>
            </select>
            <span class="select-arrow" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </div>
        </div>

        <!-- Kecamatan -->
        <div class="field-group">
          <label class="field-label" for="sel-kecamatan">
            <span class="step-badge">3</span>
            Kecamatan
          </label>
          <div class="select-wrapper">
            <select id="sel-kecamatan" class="select" disabled>
              <option value="">— Pilih Kecamatan —</option>
            </select>
            <span class="select-arrow" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </div>
        </div>

        <!-- Kelurahan/Desa -->
        <div class="field-group">
          <label class="field-label" for="sel-kelurahan">
            <span class="step-badge">4</span>
            Kelurahan / Desa
          </label>
          <div class="select-wrapper">
            <select id="sel-kelurahan" class="select" disabled>
              <option value="">— Pilih Kelurahan/Desa —</option>
            </select>
            <span class="select-arrow" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </div>
        </div>

      </div>

      <!-- Result -->
      <div id="result-area" class="result-area hidden" aria-live="polite">
        <div class="result-divider"></div>
        <div id="result-box" class="result-box">
          <div class="result-label">Kode Pos</div>
          <div id="result-code" class="result-code"></div>
          <div id="result-location" class="result-location"></div>
        </div>
      </div>

    </div>

    <footer class="footer">
      <span>© Pos Indonesia &mdash; Data Kode Pos Nasional</span>
      <span class="footer-count"><span id="row-count"></span> wilayah tercatat</span>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
