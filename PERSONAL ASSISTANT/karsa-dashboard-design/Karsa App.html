<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Karsa — Personal Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: "#FBF3E2", ink: "#1a1a1a", paper: "#ffffff",
          green: "#C9E4CA", yellow: "#FFD84D", blue: "#B7D7EA",

        fontFamily: {
          display: ['"Archivo Black"', "sans-serif"],
          sans: ['"Space Grotesk"', "sans-serif"],
          mono: ['"Space Mono"', "monospace"]
        },
        boxShadow: {
          sticker: "4px 4px 0 #1a1a1a",
          "sticker-sm": "2px 2px 0 #1a1a1a",
          "sticker-lg": "6px 6px 0 #1a1a1a"
        },
        borderWidth: { 3: "3px" }
      }
    }
  };
</script>
<style>
  html, body, #root { height: 100%; }
  body { margin: 0; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 10px; }
</style>
</head>
<body class="bg-cream font-sans text-ink">
<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.0?deps=react@18.2.0,react-dom@18.2.0"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/jsx" id="app-src">
import React, { useState } from "react";
import { createRoot } from "react-dom/client";
import { HashRouter, Routes, Route, NavLink, Outlet } from "react-router-dom";

/* =========================================================================
   ICONS  — single monoline set, shared across the app
   ========================================================================= */
const PATHS = {
  grid: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  heart: '<path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h4"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
  drop: '<path d="M12 3s6 5 6 10a6 6 0 0 1-12 0c0-5 6-10 6-10z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  check: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  dollar: '<path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  activity: '<path d="M3 12h4l2 6 4-14 2 8h6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  bot: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 4h6"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/>',
  arrow: '<path d="M7 17 17 7M9 7h8v8"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  dumbbell: '<path d="M6.5 6.5 17.5 17.5M4 9l2-2M20 15l-2 2M9 4l2 2M15 20l-2-2M3 12l3 3M18 6l3 3"/>',
  check2: '<path d="M20 6 9 17l-5-5"/>',
  send: '<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
  chevL: '<path d="m15 18-6-6 6-6"/>',
  chevR: '<path d="m9 18 6-6-6-6"/>',
  food: '<path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M17 3c-1.5 0-3 1.5-3 5s1.5 4 3 4v9"/>',
  car: '<path d="M5 17h14M6 17V9l2-4h8l2 4v8"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/>',
  bag: '<path d="M6 2 3 6v13a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
  receipt: '<path d="M5 3v18l2-1.5L9 21l2-1.5L13 21l2-1.5L17 21l2-1.5V3l-2 1.5L15 3l-2 1.5L11 3 9 4.5 7 3z"/><path d="M9 8h6M9 12h6"/>'
};
function Icon({ name, size = 20, sw = 2.3, fill = "none", stroke = "#1a1a1a", className = "" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={stroke}
      strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={className}
      dangerouslySetInnerHTML={{ __html: PATHS[name] }} />
  );
}
function Star({ filled }) {
  return (
    <svg width="15" height="15" viewBox="0 0 24 24" fill={filled ? "#1a1a1a" : "none"}
      stroke="#1a1a1a" strokeWidth="1.6" strokeLinejoin="round">
      <path d="M12 2.5l2.9 6 6.6.6-5 4.4 1.5 6.5L12 17.6 6 20.5l1.5-6.5-5-4.4 6.6-.6z" />
    </svg>
  );
}

/* =========================================================================
   REUSABLE PRIMITIVES — Card, Button, Badge  (shared across every page)
   ========================================================================= */
function Card({ className = "", children, as: Tag = "div", ...rest }) {
  return (
    <Tag className={`border-3 border-ink rounded-2xl shadow-sticker ${className}`} {...rest}>
      {children}
    </Tag>
  );
}
function Button({ color = "yellow", variant = "solid", className = "", children, ...rest }) {
  const solid = `bg-${color} text-ink shadow-sticker`;
  const dark = `bg-ink text-${color} shadow-[3px_3px_0_rgba(0,0,0,0.25)]`;
  return (
    <button
      className={`inline-flex items-center justify-center gap-2 border-3 border-ink rounded-xl px-4 py-3 font-sans font-bold text-[15px] cursor-pointer transition active:translate-x-[2px] active:translate-y-[2px] active:shadow-none ${variant === "dark" ? dark : solid} ${className}`}
      {...rest}>
      {children}
    </button>
  );
}
function Badge({ color = "cream", mono = true, className = "", children }) {
  return (
    <span className={`inline-block bg-${color} border-2 border-ink rounded-full px-2.5 py-[3px] text-[10.5px] font-bold ${mono ? "font-mono" : "font-sans"} ${className}`}>
      {children}
    </span>
  );
}

/* =========================================================================
   NAV MODEL — one source of truth for routes + accents
   ========================================================================= */
const NAV = [
  { to: "/", label: "Dashboard", icon: "grid", accent: "yellow", end: true },
  { to: "/health", label: "Health Manager", icon: "heart", accent: "green" },
  { to: "/finance", label: "Finance Manager", icon: "card", accent: "yellow" },
  { to: "/tasks", label: "Task Manager", icon: "list", accent: "blue" },
  { to: "/skincare", label: "Skincare Assistant", icon: "drop", accent: "pink" },
  { to: "/settings", label: "Settings", icon: "gear", accent: "lilac" }
];

/* =========================================================================
   SIDEBAR — highlights the active route via NavLink isActive
   ========================================================================= */
function Sidebar() {
  return (
    <aside className="w-[250px] shrink-0 flex flex-col gap-6 bg-paper border-3 border-ink rounded-[20px] shadow-sticker-lg p-5">
      <div className="flex items-center gap-3 px-1.5 pb-3.5 border-b-3 border-ink">
        <div className="w-10 h-10 bg-yellow border-3 border-ink rounded-xl shadow-sticker-sm flex items-center justify-center">
          <Icon name="grid" size={18} sw={2.6} />
        </div>
        <span className="font-display text-2xl tracking-tight">Karsa</span>
      </div>

      <nav className="flex flex-col gap-2.5">
        {NAV.map((n) => (
          <NavLink key={n.to} to={n.to} end={n.end}
            className={({ isActive }) =>
              `flex items-center gap-3 w-full px-3 py-2.5 rounded-[13px] border-3 font-sans font-semibold text-[15px] transition ${
                isActive ? `bg-${n.accent} border-ink shadow-sticker-sm` : "bg-transparent border-transparent text-ink hover:bg-cream"
              }`}>
            <span className="w-[22px] flex justify-center"><Icon name={n.icon} /></span>
            {n.label}
          </NavLink>
        ))}
      </nav>

      <Card className="mt-auto bg-green shadow-sticker p-4">
        <div className="font-display text-sm leading-tight">Pro tip</div>
        <div className="text-[12.5px] mt-1.5 leading-snug">Log your water 3× today to keep your streak alive.</div>
      </Card>
    </aside>
  );
}

/* =========================================================================
   HEADER — search, notifications, avatar (shared)
   ========================================================================= */
function Header() {
  return (
    <header className="flex items-center gap-4">
      <div className="flex-1 flex items-center gap-2.5 bg-paper border-3 border-ink rounded-[14px] shadow-sticker px-4 py-3">
        <Icon name="search" size={19} sw={2.4} />
        <input placeholder="Search tasks, expenses, reminders…"
          className="border-0 outline-none bg-transparent font-sans text-[15px] w-full text-ink" />
      </div>
      <button className="relative w-[50px] h-[50px] shrink-0 bg-yellow border-3 border-ink rounded-[14px] shadow-sticker flex items-center justify-center cursor-pointer">
        <Icon name="bell" size={21} sw={2.4} />
        <span className="absolute -top-1.5 -right-1.5 w-[18px] h-[18px] bg-pink border-[2.5px] border-ink rounded-full text-[10px] font-bold font-mono flex items-center justify-center">3</span>
      </button>
      <div className="flex items-center gap-3 bg-paper border-3 border-ink rounded-[14px] shadow-sticker py-1.5 pl-1.5 pr-3.5">
        <div className="w-[38px] h-[38px] border-[2.5px] border-ink rounded-[10px] bg-blue flex items-center justify-center font-display text-[15px]">M</div>
        <div className="leading-tight">
          <div className="font-bold text-[13.5px]">Maya R.</div>
          <div className="text-[11px] text-neutral-500 font-mono">Free plan</div>
        </div>
      </div>
    </header>
  );
}

/* =========================================================================
   LAYOUT — sidebar + header + routed <Outlet/>
   ========================================================================= */
function PageTitle({ title, subtitle, children }) {
  return (
    <div className="flex items-end justify-between gap-5">
      <div>
        <h1 className="font-display text-[42px] m-0 tracking-tight leading-none">{title}</h1>
        <p className="mt-3 text-[15px] text-neutral-700">{subtitle}</p>
      </div>
      {children}
    </div>
  );
}
function Layout() {
  return (
    <div className="min-h-full flex p-5 gap-5">
      <Sidebar />
      <div className="flex-1 min-w-0 flex flex-col gap-[22px]">
        <Header />
        <Outlet />
      </div>
    </div>
  );
}

/* =========================================================================
   PAGE — DASHBOARD  (/)
   ========================================================================= */
const SUMMARY = [
  { key: "tasks", bg: "blue", icon: "check", tag: "TODAY", big: <>3<span className="text-[18px] text-[#2c3e46]">/5</span></>, label: "Today's Tasks",
    extra: <div className="h-[9px] bg-cream border-2 border-ink rounded-full overflow-hidden"><div className="w-3/5 h-full bg-ink" /></div> },
  { key: "spend", bg: "yellow", icon: "dollar", tag: "WEEK", big: "$284", label: "Weekly Spending",
    extra: <div className="flex items-end gap-1.5 h-[30px]">{[40,70,50,90,60,35,55].map((h,i)=><div key={i} className={`flex-1 rounded-t-[3px] border-ink ${i>4?"bg-pink border-[1.5px]":"bg-ink"}`} style={{height:h+"%"}} />)}</div> },
  { key: "skin", bg: "pink", icon: "drop", tag: "PM", big: <span className="text-[27px]">9:00 PM</span>, label: "Skincare Reminder",
    extra: <div className="text-[12.5px] bg-cream border-2 border-ink rounded-[10px] px-2.5 py-[7px] font-semibold">Next: Niacinamide serum</div> },
  { key: "health", bg: "green", icon: "activity", tag: "TODAY", big: "7.2k", label: "Health Stats · Steps",
    extra: <div className="flex gap-2">{[["6/8","WATER"],["7.5h","SLEEP"]].map(([a,b])=><div key={b} className="flex-1 bg-cream border-2 border-ink rounded-[10px] px-2 py-1.5 text-center"><div className="font-display text-[15px]">{a}</div><div className="text-[10px] font-mono">{b}</div></div>)}</div> }
];
function Dashboard() {
  return (
    <>
      <PageTitle title="Hello, Maya." subtitle="Here's what your day looks like — Sunday, July 6. You've got 5 tasks and 2 reminders lined up.">
        <Icon name="clock" size={40} className="shrink-0" />
      </PageTitle>

      <div className="grid grid-cols-4 gap-[18px]">
        {SUMMARY.map((c) => (
          <Card key={c.key} className={`bg-${c.bg} shadow-sticker-lg p-[18px] flex flex-col gap-3.5`}>
            <div className="flex items-center justify-between">
              <div className="w-[42px] h-[42px] bg-cream border-[2.5px] border-ink rounded-xl flex items-center justify-center"><Icon name={c.icon} /></div>
              <span className="font-mono text-[11px] font-bold bg-ink text-white px-2 py-[3px] rounded-full">{c.tag}</span>
            </div>
            <div>
              <div className="font-display text-[38px] leading-none">{c.big}</div>
              <div className="font-bold text-sm mt-1">{c.label}</div>
            </div>
            {c.extra}
          </Card>
        ))}
      </div>

      <div className="mt-1">
        <h2 className="font-display text-[22px] mb-3.5">Quick links</h2>
        <div className="grid grid-cols-4 gap-4">
          {[["Add Task","blue"],["Log Expense","yellow"],["Log Water","green"],["New Note","pink"]].map(([l,bg]) => (
            <button key={l} className={`flex items-center justify-between w-full px-[18px] py-[15px] bg-${bg} border-3 border-ink rounded-[14px] shadow-sticker cursor-pointer font-sans font-bold text-[15px]`}>
              {l}<Icon name="arrow" size={18} sw={2.6} />
            </button>
          ))}
        </div>
      </div>
    </>
  );
}

/* =========================================================================
   PAGE — TASK MANAGER  (/tasks)
   ========================================================================= */
const PRIO_BG = { High: "pink", Medium: "yellow", Low: "green" };
const TASKS = [
  { id:"t1", title:"Submit Data Structures Assignment", due:"Due today · Jul 6", priority:"High", diff:4, source:"myITS Classroom" },
  { id:"t2", title:"Weekly grocery budget review", due:"Tomorrow · Jul 7", priority:"Medium", diff:2, source:"Finance Manager" },
  { id:"t3", title:"Read Chapter 5 — Algorithms", due:"Wed · Jul 8", priority:"Medium", diff:3, source:"myITS Classroom" },
  { id:"t4", title:"Book dermatologist appointment", due:"Thu · Jul 9", priority:"Low", diff:1, source:"Skincare Assistant" },
  { id:"t5", title:"Prepare project presentation slides", due:"Fri · Jul 10", priority:"High", diff:5, source:"Team Project" }
];
const DEADLINES = { 6:"pink", 7:"yellow", 8:"yellow", 9:"green", 10:"pink" };
function CalendarGrid({ mini }) {
  const cells = [];
  for (let i = 0; i < 3; i++) cells.push(null);
  for (let d = 1; d <= 31; d++) cells.push(d);
  return (
    <div className={`grid grid-cols-7 ${mini ? "gap-0.5" : "gap-2"}`}>
      {cells.map((d, i) => {
        if (!d) return <div key={i} />;
        const dc = DEADLINES[d], today = d === 6;
        if (mini) return (
          <div key={i} className={`relative aspect-square flex items-center justify-center rounded-lg text-xs font-semibold ${today ? "bg-blue border-2 border-ink" : ""}`}>
            {d}{dc && <span className={`absolute bottom-0.5 left-1/2 -translate-x-1/2 w-[5px] h-[5px] rounded-full bg-${dc} border border-ink`} />}
          </div>
        );
        return (
          <div key={i} className={`min-h-[66px] border-[2.5px] border-ink rounded-[11px] px-2 py-1.5 ${today ? "bg-blue" : "bg-paper"}`}>
            <span className="font-sans font-bold text-sm">{d}</span>
            {dc && <span className={`block mt-1.5 h-1.5 rounded-md bg-${dc} border-[1.5px] border-ink`} />}
          </div>
        );
      })}
    </div>
  );
}
function TaskManager() {
  const [done, setDone] = useState({});
  const [view, setView] = useState("List");
  const open = TASKS.filter((t) => !done[t.id]).length;
  const tog = (id) => setDone((s) => ({ ...s, [id]: !s[id] }));
  const WD = ["S","M","T","W","T","F","S"];
  return (
    <>
      <PageTitle title="Task Manager" subtitle={<>You have <b>{open}</b> open tasks · 2 due today.</>}>
        <div className="flex items-center gap-3.5">
          <div className="flex gap-1 bg-paper border-3 border-ink rounded-[14px] shadow-sticker p-1">
            {["List","Calendar"].map((v) => (
              <button key={v} onClick={() => setView(v)}
                className={`font-sans font-bold text-sm px-[18px] py-2 rounded-[10px] cursor-pointer border-[2.5px] ${view===v ? "bg-blue border-ink shadow-sticker-sm" : "bg-transparent border-transparent text-neutral-500"}`}>{v}</button>
            ))}
          </div>
          <Button color="blue"><Icon name="plus" size={18} sw={3} /> Add Task</Button>
        </div>
      </PageTitle>

      {view === "List" ? (
        <div className="grid grid-cols-[1fr_320px] gap-5 items-start">
          <div className="flex flex-col gap-4">
            {TASKS.map((t) => {
              const d = done[t.id];
              return (
                <Card key={t.id} className="bg-paper shadow-sticker-lg p-4 flex items-center gap-4">
                  <div className={`w-2 self-stretch rounded-md border-2 border-ink bg-${PRIO_BG[t.priority]}`} />
                  <button onClick={() => tog(t.id)}
                    className={`shrink-0 w-7 h-7 border-[2.5px] border-ink rounded-lg cursor-pointer flex items-center justify-center shadow-sticker-sm ${d ? "bg-ink" : "bg-white"}`}>
                    {d && <Icon name="check2" size={16} sw={3.2} stroke="#fff" />}
                  </button>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2.5 mb-2 flex-wrap">
                      <Badge color={PRIO_BG[t.priority]}>{t.priority.toUpperCase()}</Badge>
                      <Badge color="cream">{t.source}</Badge>
                    </div>
                    <h3 className={`m-0 font-display text-[17px] tracking-tight ${d ? "line-through text-neutral-400" : ""}`}>{t.title}</h3>
                    <div className="flex items-center gap-1.5 mt-1.5 text-[13px] text-neutral-500 font-semibold">
                      <Icon name="clock" size={15} sw={2.4} stroke="#5a5a5a" />{t.due}
                    </div>
                  </div>
                  <div className="shrink-0 text-right">
                    <div className="text-[10px] font-mono font-bold text-neutral-400 mb-1.5">DIFFICULTY {t.diff}/5</div>
                    <div className="flex gap-0.5 justify-end">{[1,2,3,4,5].map((n) => <Star key={n} filled={n<=t.diff} />)}</div>
                  </div>
                </Card>
              );
            })}
          </div>

          <Card as="aside" className="bg-paper shadow-sticker-lg p-[18px]">
            <div className="flex items-center justify-between mb-3">
              <span className="font-display text-[17px]">July 2026</span>
              <div className="flex gap-1.5">
                {["chevL","chevR"].map((c) => <div key={c} className="w-[26px] h-[26px] border-[2.5px] border-ink rounded-lg flex items-center justify-center"><Icon name={c} size={13} sw={3} /></div>)}
              </div>
            </div>
            <div className="grid grid-cols-7 gap-0.5 mb-1">{WD.map((w,i) => <div key={i} className="text-center font-mono text-[10px] font-bold text-neutral-400">{w}</div>)}</div>
            <CalendarGrid mini />
            <div className="border-t-[2.5px] border-ink my-4" />
            <div className="font-mono text-[11px] font-bold text-neutral-400 mb-2.5">UPCOMING DEADLINES</div>
            <div className="flex flex-col gap-2.5">
              {[["06","JUL","Data Structures Assignment","pink"],["07","JUL","Grocery budget review","yellow"],["10","JUL","Presentation slides","pink"]].map(([d,m,l,c]) => (
                <div key={d+l} className="flex items-center gap-3">
                  <div className="shrink-0 w-[42px] text-center bg-cream border-[2.5px] border-ink rounded-[10px] py-1"><div className="font-display text-base leading-none">{d}</div><div className="font-mono text-[8.5px]">{m}</div></div>
                  <div className="flex items-center gap-2 text-[13px] font-semibold leading-tight"><span className={`shrink-0 w-2.5 h-2.5 rounded-full border-2 border-ink bg-${c}`} />{l}</div>
                </div>
              ))}
            </div>
          </Card>
        </div>
      ) : (
        <Card className="bg-paper shadow-sticker-lg p-[22px]">
          <div className="flex items-center justify-between mb-4">
            <span className="font-display text-2xl">July 2026</span>
            <div className="flex items-center gap-3.5 text-xs font-mono font-bold">
              {[["High","pink"],["Med","yellow"],["Low","green"]].map(([l,c]) => <span key={l} className="flex items-center gap-1.5"><span className={`w-3 h-3 rounded-[3px] border-2 border-ink bg-${c}`} />{l.toUpperCase()}</span>)}
            </div>
          </div>

          </SettingsSection>
        </div>

        {/* RIGHT COLUMN */}
        <div className="flex flex-col gap-5">

          <SettingsSection icon="list" title="Module connections" desc="Apps linked to your Karsa account">
            <div className="flex flex-col gap-3">
              <ConnRow icon="grid" name="myITS Classroom" sub="Syncs your assignments" badge="CONNECTED" badgeColor="green" />
              <ConnRow icon="clock" name="Google Calendar" sub="Sync deadlines & events" badge="DISCONNECTED" badgeColor="red-300"
                action={<button className="bg-paper border-[2.5px] border-ink rounded-lg shadow-sticker-sm px-3 py-1.5 text-[12px] font-bold cursor-pointer">Connect</button>} />
              <ConnRow icon="receipt" name="GoPay PDF import" sub="Last synced Jul 5, 2026" badge="ACTIVE" badgeColor="blue" />
            </div>
          </SettingsSection>

          <SettingsSection icon="drop" title="Data & privacy" desc="Control your personal data">
            <div className="flex gap-3 mb-4">
              <Button variant="dark" color="lilac" className="flex-1"><Icon name="upload" size={16} sw={2.6} stroke="#E4D5F7" /> Export my data</Button>
              <Button color="red-300" className="flex-1">Delete account</Button>
            </div>
            <p className="m-0 text-[12.5px] text-neutral-500 leading-snug bg-cream border-2 border-ink rounded-xl px-3.5 py-3">
              Your skincare &amp; health logs are encrypted at rest and never shared with third parties. Only you can export or delete them.
            </p>
          </SettingsSection>

          <SettingsSection icon="gear" title="Account">
            <div className="flex flex-col gap-3">
              <button className="w-full flex items-center justify-center gap-2 bg-paper border-3 border-ink rounded-xl shadow-sticker px-4 py-3 font-sans font-bold text-[15px] cursor-pointer">Change password</button>
              <Button color="red-300" className="w-full">Log out</Button>
            </div>
          </SettingsSection>
        </div>
      </div>
    </>
  );
}

/* =========================================================================
   APP — routes
   ========================================================================= */
function App() {
  return (
    <HashRouter>
      <Routes>
        <Route element={<Layout />}>
          <Route path="/" element={<Dashboard />} />
          <Route path="/tasks" element={<TaskManager />} />
          <Route path="/finance" element={<FinanceManager />} />
          <Route path="/health" element={<HealthManager />} />
          <Route path="/skincare" element={<SkincareAssistant />} />
          <Route path="/settings" element={<Settings />} />
          <Route path="*" element={<Dashboard />} />
        </Route>
      </Routes>
    </HashRouter>
  );
}
createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // Transpile the JSX module (classic runtime → no jsx-runtime import) and run it,
  // resolving bare "react" / "react-router-dom" specifiers via the importmap above.
  (function () {
    var src = document.getElementById("app-src").textContent;
    var out = Babel.transform(src, {
      presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
      sourceType: "module"
    }).code;
    var url = URL.createObjectURL(new Blob([out], { type: "text/javascript" }));
    import(url).catch(function (e) { console.error("Karsa boot error:", e); });
  })();
</script>
</body>
</html>
